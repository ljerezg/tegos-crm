name: Keep-alive — Tegos CRM

on:
  schedule:
    # Día 15 de cada mes a las 9:00 UTC (< 45 días, mantiene activo el repositorio)
    - cron: '0 9 15 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Commit vacío para mantener workflows activos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit vacío
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "chore: keep-alive [skip ci]"
          git push
